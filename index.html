<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial 2026 - Horarios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mundial 2026</h1>
    <p>Horarios en sede local, Espana peninsular y Canarias</p>
  </header>

  <main>
    <section class="filtros">
      <input type="text" id="buscador" placeholder="Buscar seleccion, ciudad o estadio...">
    </section>

    <section>
      <table>
        <thead>
          <tr>
            <th>Partido</th>
            <th>Ciudad</th>
            <th>Estadio</th>
            <th>Hora Local</th>
            <th>Hora Peninsular</th>
            <th>Hora Canarias</th>
          </tr>
        </thead>
        <tbody id="tablaPartidos"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Proyecto creado con GitHub Pages</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
